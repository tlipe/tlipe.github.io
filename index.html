<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Página inexistente</title>
  <style>
    :root{--bg:#0b0b0d;--fg:#e9e9e9;--muted:#8f8f8f}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial}
    .wrap{max-width:760px;margin:0 auto;padding:12vh 1.25rem;text-align:center}
    h1{font-size:2rem;margin:0 0 .5rem}
    p{margin:.5rem 0;color:#cfcfcf}
    .muted{color:var(--muted);margin-top:1.25rem}
    code{background:#0f0f11;padding:.15rem .4rem;border-radius:6px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>404 — Página inexistente</h1>
    <p>Nada aqui. Parece que você achou uma página que não existe neste site.</p>
    <p class="muted">Este repositório funciona como contêiner de apps em subpastas; nada está hospedado diretamente na raiz.</p>
    <p class="muted">Se esperava um aplicativo, verifique os subdiretórios do repositório.</p>
  </main>
</body>
</html>
