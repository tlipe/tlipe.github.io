<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GitHub Pages - Apps</title>
  <style>
    :root{--bg:#0b0b0d;--fg:#e9e9e9;--muted:#8f8f8f;--accent:#58a6ff}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial}
    .wrap{max-width:760px;margin:0 auto;padding:12vh 1.25rem;text-align:center}
    h1{font-size:2rem;margin:0 0 .5rem}
    p{margin:.5rem 0;color:#cfcfcf}
    .muted{color:var(--muted);margin-top:1.25rem}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .app-link{display:inline-block;margin:1rem 0;padding:0.75rem 1.5rem;background:var(--accent);color:#fff;border-radius:8px;font-weight:600}
    .app-link:hover{text-decoration:none;background:#4590e6}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Bem-vindo!</h1>
    <p>Este repositório hospeda aplicativos GitHub Pages.</p>
    <p><a href="/gh-search/" class="app-link">Acessar gh-search →</a></p>
    <p class="muted">Navegue pelos subdiretórios para acessar os aplicativos disponíveis.</p>
  </main>
</body>
</html>
